<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#FBFAFD">
<meta name="description" content="Realize Planejamento e Gestão Financeira — plataforma do cliente.">
<title>Realize — Planejamento e Gestão Financeira</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://script.google.com">
<style>
  /* A página inteira é o aplicativo: sem margem, sem rolagem por fora.
     Quem rola é o app, por dentro — assim o cabeçalho dele fica sempre no lugar. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #EFECF7; }
  .carregando {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    font-family: Jost, "Century Gothic", "Segoe UI", Arial, sans-serif; color: #7A4A61; font-size: 14px;
  }
  .carregando strong { font-size: 22px; letter-spacing: .14em; color: #4C1130; }
  iframe {
    position: fixed; inset: 0; display: block; border: 0; background: transparent;
    width: 100%; height: 100%;
    height: 100dvh;                 /* altura real da tela no celular, descontando a barra do navegador */
  }
</style>
</head>
<body>

<div class="carregando" aria-hidden="true">
  <strong>REALIZE</strong>
  <span>Carregando…</span>
</div>

<iframe id="app" title="Realize — Planejamento e Gestão Financeira"
  allow="clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<noscript>
  <p style="position:fixed;bottom:16px;left:0;right:0;text-align:center;font-family:Arial;color:#9C2A2A">
    A plataforma precisa de JavaScript habilitado no navegador.
  </p>
</noscript>

<script>
(function () {
  /* ÚNICA LINHA A EDITAR, se a implantação mudar: o endereço do app que termina em /exec
     (Apps Script › Implantar › Gerenciar implantações). */
  var APP = "https://script.google.com/macros/s/AKfycbxhork4TRVF3JH7xyoOtgDP8dtgSfGHrOwovCLuO0f2AvH0Isj29PJ870odoD9JJMtH/exec";

  /* Só estes parâmetros passam para o app, e só em formato esperado. */
  function limpar(origem) {
    var ok = {};
    Object.keys(origem || {}).forEach(function (k) {
      var v = String(origem[k] == null ? "" : origem[k]);
      if (/^[a-z]{1,12}$/i.test(k) && /^[A-Za-z0-9_-]{1,40}$/.test(v)) ok[k] = v;
    });
    return ok;
  }
  function busca(par) {
    var q = Object.keys(par).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(par[k]);
    }).join("&");
    return q ? "?" + q : "";
  }

  /* Abertura: o que estiver no endereço desta página vai para o app
     (ex.: realize.ricardomacoli.com/?p=area&cli=ABC123 abre direto a área). */
  var inicial = {};
  new URLSearchParams(location.search).forEach(function (v, k) { inicial[k] = v; });
  inicial = limpar(inicial);
  inicial.embed = "1";
  document.getElementById("app").src = APP + busca(inicial);

  /* O app avisa qual tela está aberta; o endereço desta página acompanha,
     para o F5 e os links copiados abrirem a mesma tela. */
  window.addEventListener("message", function (e) {
    if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(e.origin)) return;
    var d = e.data;
    if (!d || d.realize !== "rota" || typeof d.par !== "object") return;
    var par = limpar(d.par);
    delete par.embed; delete par.sair;
    try { history.replaceState(null, "", location.pathname + busca(par)); } catch (err) {}
    if (d.titulo && typeof d.titulo === "string") document.title = d.titulo.slice(0, 120);
  });
})();
</script>
</body>
</html>
